<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1000" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1520" height="1000" fill="#FFFFFF"/>

  <!-- title -->
  <text x="760" y="60" text-anchor="middle" font-size="36" font-weight="bold" fill="#111">Current Order-to-Shipment Process (As-Is)</text>

  <!-- swimlane headers -->
  <g stroke="#333" stroke-width="1">
    <rect x="35"   y="120" width="250" height="50" fill="#DCE8CF"/>
    <rect x="370"  y="120" width="410" height="50" fill="#DBE3F1"/>
    <rect x="1043" y="120" width="272" height="50" fill="#FBF3D6"/>
  </g>
  <g font-size="23" fill="#111" text-anchor="middle">
    <text x="160"  y="153">Customer</text>
    <text x="575"  y="153">Business Owner / Sales</text>
    <text x="1179" y="153">Production</text>
  </g>

  <!-- process boxes -->
  <g stroke="#111" stroke-width="1.5" fill="#FFFFFF">
    <rect x="35"   y="245" width="250" height="125"/>
    <rect x="365"  y="245" width="215" height="125"/>
    <rect x="645"  y="245" width="195" height="125"/>
    <rect x="1150" y="245" width="205" height="125"/>
    <rect x="855"  y="480" width="250" height="82"/>
    <rect x="855"  y="632" width="250" height="115"/>
    <rect x="855"  y="800" width="250" height="140"/>
  </g>

  <!-- decision diamond -->
  <polygon points="980,240 1080,307 980,374 880,307" fill="#FFFFFF" stroke="#111" stroke-width="1.5"/>

  <!-- box text -->
  <g font-size="21" fill="#111" text-anchor="middle">
    <text x="160" y="292">1. Customer sends</text>
    <text x="160" y="318">order via email or</text>
    <text x="160" y="344">social media</text>
    <text x="472" y="292">2. Record order</text>
    <text x="472" y="318">manually in</text>
    <text x="472" y="344">notebook</text>
    <text x="742" y="305">3. Check stock</text>
    <text x="742" y="331">availability</text>
    <text x="980" y="300">Stock</text>
    <text x="980" y="326">available?</text>
    <text x="1252" y="292">4a. Arrange</text>
    <text x="1252" y="318">materials /</text>
    <text x="1252" y="344">plan production</text>
    <text x="980" y="529">4b. Produce items</text>
    <text x="980" y="682">5. Ship order to</text>
    <text x="980" y="708">customer</text>
    <text x="980" y="850">6. Update sales record</text>
    <text x="980" y="876">in a separate sheet</text>
    <text x="980" y="902">(often later)</text>
  </g>

  <!-- branch labels -->
  <g font-size="21" fill="#111">
    <text x="1104" y="298" text-anchor="middle">No</text>
    <text x="1012" y="432" text-anchor="middle">Yes</text>
  </g>

  <!-- arrows -->
  <g stroke="#111" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="285"  y1="307" x2="360"  y2="307"/>
    <line x1="580"  y1="307" x2="640"  y2="307"/>
    <line x1="840"  y1="307" x2="875"  y2="307"/>
    <line x1="1080" y1="307" x2="1145" y2="307"/>
    <line x1="980"  y1="374" x2="980"  y2="476"/>
    <path d="M1252,370 L1252,521 L1110,521"/>
    <line x1="980"  y1="562" x2="980"  y2="628"/>
    <line x1="980"  y1="747" x2="980"  y2="796"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="12" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#111"/>
    </marker>
  </defs>
</svg>
